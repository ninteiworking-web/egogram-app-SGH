<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>エゴグラム診断（20問簡易版）</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for radar chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-indigo-600 text-white shadow-md py-4 px-6 text-center">
        <h1 class="text-xl font-bold">エゴグラム診断（20問簡易版）</h1>
        <p class="text-xs text-indigo-100 mt-1">自己理解とコミュニケーション改善のための心理テスト</p>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-grow container mx-auto px-4 py-6 max-w-xl">

        <!-- スタート画面 -->
        <div id="start-screen" class="bg-white rounded-2xl shadow-sm p-6 text-center">
            <div class="text-indigo-600 text-5xl mb-4">🧠</div>
            <h2 class="text-lg font-bold mb-3">自分の心の傾向を知る</h2>
            <p class="text-sm text-slate-600 mb-6 leading-relaxed">
                全20問の質問に「はい」「どちらでもない」「いいえ」でお答えください。<br>
                あなたの5つの自我状態（CP, NP, A, FC, AC）のバランスをグラフとタイプ別カードで分かりやすく表示します。
            </p>
            <button onclick="startQuiz()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl shadow transition duration-200">
                診断を始める（全20問）
            </button>
        </div>

        <!-- クイズ画面 -->
        <div id="quiz-screen" class="hidden">
            <div class="mb-4 flex justify-between items-center text-sm font-semibold text-slate-500 px-1">
                <span id="progress-text">質問 1 / 20</span>
                <span id="category-badge" class="bg-indigo-100 text-indigo-700 px-2.5 py-0.5 rounded-full text-xs"></span>
            </div>
            <!-- プログレスバー -->
            <div class="w-full bg-slate-200 h-2 rounded-full mb-6 overflow-hidden">
                <div id="progress-bar" class="bg-indigo-600 h-full w-0 transition-all duration-300"></div>
            </div>

            <!-- 質問カード -->
            <div class="bg-white rounded-2xl shadow-sm p-6 mb-4">
                <h3 id="question-text" class="text-base font-bold text-slate-800 mb-6 leading-relaxed">
                    <!-- 質問がここに挿入されます -->
                </h3>

                <!-- 選択肢ボタン -->
                <div class="space-y-3">
                    <button onclick="answer(2)" class="w-full text-left p-4 rounded-xl border border-slate-200 hover:border-indigo-600 hover:bg-indigo-50 font-medium text-sm transition flex items-center justify-between group">
                        <span>はい（そう思う）</span>
                        <span class="w-5 h-5 rounded-full border border-slate-300 group-hover:border-indigo-600 flex items-center justify-center text-xs text-transparent group-hover:text-indigo-600">●</span>
                    </button>
                    <button onclick="answer(1)" class="w-full text-left p-4 rounded-xl border border-slate-200 hover:border-indigo-600 hover:bg-indigo-50 font-medium text-sm transition flex items-center justify-between group">
                        <span>どちらでもない</span>
                        <span class="w-5 h-5 rounded-full border border-slate-300 group-hover:border-indigo-600 flex items-center justify-center text-xs text-transparent group-hover:text-indigo-600">●</span>
                    </button>
                    <button onclick="answer(0)" class="w-full text-left p-4 rounded-xl border border-slate-200 hover:border-indigo-600 hover:bg-indigo-50 font-medium text-sm transition flex items-center justify-between group">
                        <span>いいえ（そう思わない）</span>
                        <span class="w-5 h-5 rounded-full border border-slate-300 group-hover:border-indigo-600 flex items-center justify-center text-xs text-transparent group-hover:text-indigo-600">●</span>
                    </button>
                </div>
            </div>

            <!-- 戻るボタン -->
            <button id="prev-btn" onclick="prevQuestion()" class="hidden text-xs text-slate-500 hover:text-indigo-600 underline px-1">
                ひとつ前の質問に戻る
            </button>
        </div>

        <!-- 結果画面 -->
        <div id="result-screen" class="hidden space-y-6">
            <div class="bg-white rounded-2xl shadow-sm p-6">
                <div class="text-center mb-4">
                    <h2 class="text-xl font-bold text-slate-800 mb-1">診断結果</h2>
                    <!-- 型のタイトルカード風表示 -->
                    <div id="pattern-card-header" class="inline-block bg-indigo-50 border border-indigo-100 px-4 py-3 rounded-xl my-2 w-full">
                        <div id="pattern-title" class="text-base font-bold text-indigo-700">判定中...</div>
                        <div id="pattern-desc" class="text-xs text-slate-600 mt-1">...</div>
                    </div>
                </div>
                
                <!-- レーダーチャート -->
                <div class="relative w-full max-w-xs mx-auto h-64 mb-4">
                    <canvas id="radarChart"></canvas>
                </div>

                <!-- スコア一覧（20問版は各4問×最大2点＝最大8点） -->
                <div class="grid grid-cols-5 gap-2 text-center bg-slate-50 p-3 rounded-xl mb-4">
                    <div>
                        <div class="text-[10px] text-slate-500 font-bold">CP</div>
                        <div id="score-cp" class="text-base font-extrabold text-indigo-600">0</div>
                    </div>
                    <div>
                        <div class="text-[10px] text-slate-500 font-bold">NP</div>
                        <div id="score-np" class="text-base font-extrabold text-indigo-600">0</div>
                    </div>
                    <div>
                        <div class="text-[10px] text-slate-500 font-bold">A</div>
                        <div id="score-a" class="text-base font-extrabold text-indigo-600">0</div>
                    </div>
                    <div>
                        <div class="text-[10px] text-slate-500 font-bold">FC</div>
                        <div id="score-fc" class="text-base font-extrabold text-indigo-600">0</div>
                    </div>
                    <div>
                        <div class="text-[10px] text-slate-500 font-bold">AC</div>
                        <div id="score-ac" class="text-base font-extrabold text-indigo-600">0</div>
                    </div>
                </div>

                <button onclick="location.reload()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-6 rounded-xl text-sm transition">
                    もう一度診断する
                </button>
            </div>

            <!-- 解説カード -->
            <div class="bg-white rounded-2xl shadow-sm p-6 space-y-4">
                <h3 class="font-bold text-slate-800 border-b pb-2 text-sm">各自我状態の解説とスコア傾向</h3>
                <div id="analysis-details" class="space-y-4 text-xs text-slate-600 leading-relaxed">
                    <!-- 動的に解説が挿入されます -->
                </div>
            </div>
        </div>

    </main>

    <!-- フッター -->
    <footer class="text-center py-4 text-[10px] text-slate-400">
        &copy; Egogram Assessment Tool (20-Question Version)
    </footer>

    <!-- スクリプト -->
    <script>
        // 20問の質問データ（各カテゴリ4問）
        const questions = [
            // CP (Critical Parent: 厳しき親)
            { text: "礼儀作法やマナーには厳格な方だ", type: "CP" },
            { text: "曲がったことや不誠実な態度は許せない", type: "CP" },
            { text: "ルールや規則は絶対に守るべきだと思っている", type: "CP" },
            { text: "相手のためを思って、つい小言や注意をしてしまう", type: "CP" },

            // NP (Nurturing Parent: 優しき親)
            { text: "他人の悩みや相談に親身になって乗ることが多い", type: "NP" },
            { text: "困っている人を見ると放っておけない", type: "NP" },
            { text: "人を褒めたり励ましたりするのが好きだ", type: "NP" },
            { text: "面倒見が良いと人から言われることが多い", type: "NP" },

            // A (Adult: 成人)
            { text: "感情に流されず、客観的・論理的に物事を判断する", type: "A" },
            { text: "問題が起きたときは、まず原因と対策を冷静に分析する", type: "A" },
            { text: "物事を決める時は、メリットとデメリットを慎重に比較する", type: "A" },
            { text: "仕事や勉強では、効率や合理性を重視する", type: "A" },

            // FC (Free Child: 自由な子ども)
            { text: "自分の感情や欲求に素直に従う方だ", type: "FC" },
            { text: "好奇心が旺盛で、新しいことに挑戦するのが好きだ", type: "FC" },
            { text: "明るくユーモアがあり、周りを楽しませることが好きだ", type: "FC" },
            { text: "細かいことは気にせず、楽観的に考えることが多い", type: "FC" },

            // AC (Adapted Child: 順応した子ども)
            { text: "周りの目を気にして、自分の意見を抑えてしまうことがある", type: "AC" },
            { text: "人に嫌われるのが怖くて、頼まれると断りにくい", type: "AC" },
            { text: "我慢することが美徳だと思っているところがある", type: "AC" },
            { text: "「自分はダメな人間ではないか」と悩むことがある", type: "AC" }
        ];

        let currentIdx = 0;
        let answers = new Array(questions.length).fill(null);

        const categoryNames = {
            CP: "【CP】 厳しき親（責任感・正義感）",
            NP: "【NP】 優しき親（受容・同情）",
            A:  "【A】 成人（論理・現実的）",
            FC: "【FC】 自由な子ども（楽観・好奇心）",
            AC: "【AC】 順応した子ども（協調・遠慮）"
        };

        function startQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentIdx];
            document.getElementById('progress-text').textContent = `質問 ${currentIdx + 1} / 20`;
            document.getElementById('category-badge').textContent = categoryNames[q.type];
            document.getElementById('question-text').textContent = q.text;
            
            const progress = ((currentIdx) / 20) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            if (currentIdx > 0) {
                document.getElementById('prev-btn').classList.remove('hidden');
            } else {
                document.getElementById('prev-btn').classList.add('hidden');
            }
        }

        function answer(score) {
            answers[currentIdx] = score;
            currentIdx++;

            if (currentIdx < questions.length) {
                showQuestion();
            } else {
                calculateResult();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                showQuestion();
            }
        }

        function calculateResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            const scores = { CP: 0, NP: 0, A: 0, FC: 0, AC: 0 };
            questions.forEach((q, idx) => {
                scores[q.type] += answers[idx];
            });

            document.getElementById('score-cp').textContent = scores.CP;
            document.getElementById('score-np').textContent = scores.NP;
            document.getElementById('score-a').textContent = scores.A;
            document.getElementById('score-fc').textContent = scores.FC;
            document.getElementById('score-ac').textContent = scores.AC;

            // 20問版のパターン判定
            determinePattern(scores);

            const ctx = document.getElementById('radarChart').getContext('2d');
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['CP (厳格)', 'NP (寛容)', 'A (論理)', 'FC (自由)', 'AC (協調)'],
                    datasets: [{
                        label: '自我状態スコア',
                        data: [scores.CP, scores.NP, scores.A, scores.FC, scores.AC],
                        backgroundColor: 'rgba(79, 70, 229, 0.2)',
                        borderColor: 'rgba(79, 70, 229, 1)',
                        borderWidth: 2,
                        pointBackgroundColor: 'rgba(79, 70, 229, 1)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            angleLines: { display: true },
                            suggestedMin: 0,
                            suggestedMax: 8,
                            ticks: { stepSize: 2 }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });

            generateAnalysis(scores);
        }

        function determinePattern(s) {
            let title = "への字型 円満バランス";
            let desc = "思いやりと冷静さのバランスが◎";

            // 20問版（各最大8点）用の判定目安
            if (s.NP >= 6 && s.A >= 6 && s.CP <= 5 && s.AC <= 5) {
                title = "への字型 円満バランス";
                desc = "思いやりと冷静さのバランスが◎";
            } else if (s.NP >= 6 && s.AC >= 6 && s.FC <= 4) {
                title = "N型 献身タイプ";
                desc = "人に尽くすが、がまんしやすい傾向";
            } else if (s.CP >= 6 && s.FC >= 6 && s.AC <= 4) {
                title = "逆N型 自己主張タイプ";
                desc = "考えがはっきり、行動力がある";
            } else if (s.CP >= 5 && s.NP >= 5 && s.FC >= 5 && s.A <= 4) {
                title = "M型 明るい楽天タイプ";
                desc = "明るいムードメーカー";
            } else if (s.CP >= 6 && s.AC >= 6) {
                title = "U字型 葛藤ストレスタイプ";
                desc = "理想と周りの間で悩みや負担を抱えやすい";
            } else {
                title = "バランス標準タイプ";
                desc = "柔軟で安定した心の状態です";
            }

            document.getElementById('pattern-title').textContent = title;
            document.getElementById('pattern-desc').textContent = desc;
        }

        function generateAnalysis(s) {
            const container = document.getElementById('analysis-details');
            
            function getLevel(val) {
                if (val >= 6) return "高い傾向";
                if (val <= 2) return "低い傾向";
                return "標準的";
            }

            container.innerHTML = `
                <div>
                    <strong class="text-slate-800">CP（批判的親）：${s.CP}点 (${getLevel(s.CP)})</strong>
                    <p class="text-slate-500 mt-0.5">責任感や正義感、理想主義の高さを表します。高い人は規律を重んじ、低い人は寛容で他人に寛大です。</p>
                </div>
                <div>
                    <strong class="text-slate-800">NP（養育的親）：${s.NP}点 (${getLevel(s.NP)})</strong>
                    <p class="text-slate-500 mt-0.5">優しさ、思いやり、母性を表します。高い人は面倒見が良く、低い人はサバサバとしていて自立心を重んじます。</p>
                </div>
                <div>
                    <strong class="text-slate-800">A（成人）：${s.A}点 (${getLevel(s.A)})</strong>
                    <p class="text-slate-500 mt-0.5">客観적、論理的、現実的な思考力を表します。高い人は冷静な判断が得意で、低い人は直感的・感情的に動きやすい傾向があります。</p>
                </div>
                <div>
                    <strong class="text-slate-800">FC（自由な子ども）：${s.FC}点 (${getLevel(s.FC)})</strong>
                    <p class="text-slate-500 mt-0.5">明るさ、好奇心、奔放さを表します。高い人はエネルギッシュでユーモアがあり、低い人はおとなしく控えめです。</p>
                </div>
                <div>
                    <strong class="text-slate-800">AC（順応した子ども）：${s.AC}点 (${getLevel(s.AC)})</strong>
                    <p class="text-slate-500 mt-0.5">協調性、従順さ、遠慮深さを表します。高い人は空気を読むのが得意な一方で我慢しやすく、低い人はマイペースで自己主張が強いです。</p>
                </div>
            `;
        }
    </script>
</body>
</html>
